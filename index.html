<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#2D2A2B">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>TaskFlow Pro Unificado | Contraste Total</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>

    <style>
        /* TEMA ESCURO (PADRÃO) - ALTO CONTRASTE */
        :root {
            --bg-base: #121212;
            --bg-surface: #1E1E1E;
            --bg-surface-hover: #2C2C2C;
            --bg-glass: rgba(30, 30, 30, 0.9);
            --border-color: #3A3A3A;
            --border-light: rgba(255, 255, 255, 0.08);
            --text-title: #FFFFFF;
            --text-base: #F0F0F0;
            --text-support: #C0C0C0;
            --brand-primary: #F97316;
            --brand-glow: rgba(249, 115, 22, 0.5);
            --brand-gradient: linear-gradient(135deg, #FF7F30 0%, #E85D04 100%);
            --danger: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.3);
            --success: #10b981;
            --warning: #f59e0b;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -2px rgba(0, 0, 0, 0.5);
            --card-shadow-hover: 0 15px 25px -5px rgba(0, 0, 0, 0.6);
            --pattern-color: rgba(255, 255, 255, 0.02);
        }

        /* TEMA CLARO */
        body.light-theme {
            --bg-base: #f8f9fa;
            --bg-surface: #ffffff;
            --bg-surface-hover: #f1f3f5;
            --bg-glass: rgba(255, 255, 255, 0.9);
            --border-color: #e9ecef;
            --border-light: rgba(0, 0, 0, 0.02);
            --text-title: #09090b;
            --text-base: #3f3f46;
            --text-support: #71717a;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03), 0 2px 4px -2px rgba(0, 0, 0, 0.03);
            --card-shadow-hover: 0 10px 15px -5px rgba(0, 0, 0, 0.08);
            --pattern-color: rgba(0, 0, 0, 0.04);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { 
            background-color: var(--bg-base); 
            color: var(--text-base); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow-x: hidden;
            background-image: radial-gradient(var(--pattern-color) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        :focus-visible { outline: 2px solid var(--brand-primary); outline-offset: 2px; border-radius: 2px; }

        /* HEADER E DEMAIS COMPONENTES (MESMOS ESTILOS, MAS GARANTINDO USO DAS VARIÁVEIS) */
        .app-header {
            background-color: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: env(safe-area-inset-top, 0.8rem) 1.2rem 0.8rem 1.2rem;
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .header-top { display: flex; justify-content: space-between; align-items: center; height: 44px; gap: 0.5rem; }
        .brand { font-size: 1.15rem; font-weight: 800; color: var(--text-title); display: flex; align-items: center; gap: 0.5rem; letter-spacing: -0.03em; flex-shrink: 0; }
        .brand .logo-box { background: var(--brand-gradient); padding: 0.4rem; border-radius: var(--radius-sm); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px var(--brand-glow); }
        .search-container { flex: 1; position: relative; max-width: 450px; min-width: 0; }
        .search-container input {
            width: 100%; background: var(--bg-surface); border: 1px solid var(--border-color);
            color: var(--text-title); padding: 0.5rem 1rem 0.5rem 2.4rem; border-radius: 999px;
            font-size: 0.85rem; outline: none; transition: var(--transition);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        .search-container input::placeholder { color: var(--text-support); opacity: 0.7; }
        .search-container input:focus { border-color: var(--brand-primary); box-shadow: 0 0 0 3px var(--brand-glow); }
        .search-container i { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-support); font-size: 1.1rem; }
        .header-actions { display: flex; gap: 0.5rem; align-items: center; }
        .icon-btn {
            background: var(--bg-surface); border: 1px solid var(--border-color); color: var(--text-title);
            font-size: 1.2rem; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: var(--transition);
        }
        .icon-btn:hover { background: var(--bg-surface-hover); transform: scale(1.05); }
        .pomodoro-active { background: var(--brand-gradient); border-color: transparent; color: #fff; box-shadow: 0 0 15px var(--brand-glow); }

        .dropdown-menu {
            position: absolute; right: 0; top: 50px; background: var(--bg-glass); backdrop-filter: blur(16px);
            border: 1px solid var(--border-color); border-radius: var(--radius-lg); box-shadow: var(--card-shadow-hover);
            min-width: 240px; display: none; flex-direction: column; padding: 0.5rem; z-index: 100;
        }
        .dropdown-menu.active { display: flex; animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .dropdown-item {
            display: flex; align-items: center; gap: 0.6rem; padding: 0.7rem 0.8rem; color: var(--text-title);
            font-size: 0.85rem; font-weight: 500; cursor: pointer; border-radius: var(--radius-md); transition: var(--transition);
        }
        .dropdown-item:hover { background: var(--bg-surface); }
        .dropdown-item.danger { color: var(--danger); }
        .dropdown-item.danger:hover { background: rgba(239, 68, 68, 0.1); }

        .sub-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; overflow-x: auto; padding-bottom: 0.4rem; scrollbar-width: none; }
        .sub-header::-webkit-scrollbar { display: none; }
        .mini-stats { display: flex; gap: 0.8rem; font-size: 0.75rem; font-weight: 600; color: var(--text-support); white-space: nowrap; flex-shrink: 0; }
        .mini-stats span { display: flex; align-items: center; gap: 0.3rem; background: var(--bg-surface); padding: 0.3rem 0.8rem; border-radius: 999px; border: 1px solid var(--border-color); }
        .filters-scroll { display: flex; gap: 0.5rem; overflow-x: auto; flex-shrink: 0; align-items: center; }
        .filter-pill {
            background: var(--bg-surface); border: 1px solid var(--border-color); color: var(--text-title);
            padding: 0.4rem 0.8rem; border-radius: 999px; font-size: 0.75rem; font-weight: 500; outline: none; cursor: pointer; white-space: nowrap;
        }
        .filter-pill:hover { border-color: var(--text-support); }
        .global-progress { position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: transparent; }
        .global-progress-fill { height: 100%; background: var(--brand-gradient); width: 0%; transition: width 0.6s; }
        .pomodoro-bar { height: 3px; background: #10b981; width: 0%; transition: width 1s linear; }

        .main-content {
            flex: 1; padding: 1.5rem 1rem 120px 1rem; display: flex; flex-direction: column; gap: 1rem;
            max-width: 1000px; margin: 0 auto; width: 100%;
        }
        .main-content.grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }

        .task-card {
            background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg);
            padding: 1.2rem; display: flex; flex-direction: column; gap: 0.8rem; position: relative;
            box-shadow: var(--card-shadow); transition: var(--transition);
        }
        .task-card.today { border-color: var(--brand-primary); box-shadow: 0 0 0 1px var(--brand-glow); }
        .task-card:hover { transform: translateY(-2px); box-shadow: var(--card-shadow-hover); border-color: var(--brand-primary); }
        .task-card.sortable-ghost { opacity: 0.4; transform: scale(0.98); }
        .task-card.completed { opacity: 0.6; background: var(--bg-base); }
        .task-card.completed .task-title { text-decoration: line-through; color: var(--text-support); }

        .task-header { display: flex; gap: 0.8rem; align-items: flex-start; justify-content: space-between; }
        .custom-cb {
            appearance: none; width: 22px; height: 22px; border: 2px solid var(--text-support); border-radius: 6px;
            cursor: pointer; position: relative; flex-shrink: 0; background: var(--bg-base);
        }
        .custom-cb:checked { background: var(--brand-primary); border-color: var(--brand-primary); }
        .custom-cb:checked::after { content: '✓'; position: absolute; color: #fff; font-size: 0.9rem; font-weight: 900; top: 50%; left: 50%; transform: translate(-50%, -50%); }

        .task-content { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.4rem; }
        .task-title-row { display: flex; align-items: flex-start; gap: 0.6rem; cursor: pointer; }
        .priority-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 0.4rem; }
        .priority-dot.high { background: var(--danger); }
        .priority-dot.medium { background: var(--warning); }
        .priority-dot.low { background: var(--success); }
        .task-title { font-size: 1.05rem; font-weight: 700; color: var(--text-title); }
        .task-desc { font-size: 0.85rem; color: var(--text-support); cursor: pointer; }

        .task-checklist { background: var(--bg-base); padding: 0.8rem; border-radius: var(--radius-md); margin-top: 0.4rem; border: 1px solid var(--border-color); }
        .checklist-item { display: flex; align-items: center; gap: 0.6rem; font-size: 0.85rem; cursor: pointer; color: var(--text-base); }
        .checklist-item.done span { text-decoration: line-through; color: var(--text-support); }
        .checklist-item input { width: 18px; height: 18px; accent-color: var(--brand-primary); }

        .task-actions-row { display: flex; gap: 0.2rem; flex-shrink: 0; }
        .action-icon { background: transparent; border: none; color: var(--text-support); font-size: 1.2rem; padding: 0.4rem; border-radius: var(--radius-sm); cursor: pointer; }
        .drag-handle { cursor: grab; padding: 0.4rem; color: var(--text-support); font-size: 1.2rem; }

        .task-footer { display: flex; justify-content: space-between; flex-wrap: wrap; padding-top: 0.8rem; border-top: 1px dashed var(--border-color); }
        .task-meta { display: flex; gap: 0.6rem; font-size: 0.75rem; }
        .badge { background: var(--bg-base); padding: 0.3rem 0.6rem; border-radius: 6px; border: 1px solid var(--border-color); display: flex; align-items: center; gap: 0.3rem; color: var(--text-support); }
        .badge.overdue { color: var(--danger); background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.3); }
        .badge.today { color: var(--brand-primary); background: rgba(249, 115, 22, 0.1); border-color: rgba(249, 115, 22, 0.3); }

        .subtask-container { display: flex; align-items: center; gap: 0.6rem; flex: 1; }
        .progress-track { flex: 1; height: 6px; background: var(--bg-base); border-radius: 999px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--brand-gradient); }

        .fab {
            position: fixed; bottom: 2rem; right: 2rem; width: 60px; height: 60px; border-radius: 50%;
            background: var(--brand-gradient); color: white; border: none; font-size: 2rem;
            display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 90;
            box-shadow: 0 10px 25px var(--brand-glow);
        }

        dialog { margin: auto; border: none; border-radius: var(--radius-xl); background: var(--bg-surface); max-width: 480px; width: 92%; color: var(--text-base); }
        dialog::backdrop { background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); }
        .modal-content { padding: 1.5rem; display: flex; flex-direction: column; gap: 1.2rem; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; font-weight: 800; color: var(--text-title); }
        .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .form-control { background: var(--bg-base); border: 1px solid var(--border-color); color: var(--text-title); padding: 0.8rem 1rem; border-radius: var(--radius-md); }
        .btn-primary { background: var(--brand-gradient); color: white; border: none; padding: 0.9rem; border-radius: var(--radius-md); font-weight: 700; cursor: pointer; width: 100%; }
        #toast {
            position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(150%);
            background: var(--bg-glass); backdrop-filter: blur(16px); color: var(--text-title);
            padding: 0.8rem 1.2rem; border-radius: 999px; z-index: 10000; transition: transform 0.3s;
            display: flex; gap: 1rem; align-items: center; border: 1px solid var(--border-color);
        }
        #toast.show { transform: translateX(-50%) translateY(0); }
        .toast-action { background: var(--brand-gradient); border: none; color: white; padding: 0.3rem 0.8rem; border-radius: 999px; cursor: pointer; }
        .chart-container { margin: 1rem; padding: 1rem; background: var(--bg-surface); border-radius: var(--radius-lg); display: none; }
        .chart-container.visible { display: block; }
        canvas { width: 100%; height: 120px; }
        @media (max-width: 600px) { .fab { width: 54px; height: 54px; font-size: 1.6rem; } }
    </style>
</head>
<body>
<header class="app-header">
    <div class="header-top">
        <div class="brand"><div class="logo-box"><i class="ph-bold ph-check-square-offset"></i></div><span>TaskFlow Pro</span></div>
        <div class="search-container"><i class="ph ph-magnifying-glass"></i><input type="text" id="searchInput" placeholder="Pesquisar... (Ctrl+K)"></div>
        <div class="header-actions">
            <button class="icon-btn" id="pomodoroBtn"><i class="ph ph-timer"></i></button>
            <button class="icon-btn" id="viewToggle"><i class="ph ph-grid-four"></i></button>
            <button class="icon-btn" id="themeToggleQuick"><i class="ph ph-moon"></i></button>
            <button class="icon-btn" id="menuToggle"><i class="ph ph-dots-three-vertical"></i></button>
            <div class="dropdown-menu" id="mainMenu">
                <div class="dropdown-item" id="exportBtn"><i class="ph ph-download-simple"></i> Backup JSON</div>
                <label class="dropdown-item" for="restoreFileInput"><i class="ph ph-upload-simple"></i> Restaurar Backup</label>
                <input type="file" id="restoreFileInput" accept=".json" style="display:none">
                <div class="dropdown-item" id="importListBtn"><i class="ph ph-file-csv"></i> Importar Lista</div>
                <input type="file" id="importListFileInput" accept=".csv,.json" style="display:none">
                <div class="dropdown-item" id="downloadModelBtn"><i class="ph ph-info"></i> Modelos para IA</div>
                <div style="height:1px; background:var(--border-color); margin:4px 0;"></div>
                <div class="dropdown-item" id="toggleChartBtn"><i class="ph ph-chart-bar"></i> Dashboard</div>
                <div class="dropdown-item danger" id="clearCompletedBtn"><i class="ph ph-broom"></i> Limpar Concluídas</div>
            </div>
        </div>
    </div>
    <div class="sub-header">
        <div class="mini-stats"><span id="kpi-rate"><i class="ph-fill ph-check-circle"></i> 0%</span><span id="kpi-pending"><i class="ph-fill ph-hourglass-high"></i> 0 pendentes</span><span id="kpi-high"><i class="ph-fill ph-fire"></i> 0 críticas</span></div>
        <div class="filters-scroll">
            <button id="clearFiltersBtn" class="filter-pill" style="display:none;"><i class="ph ph-x"></i> Limpar</button>
            <select id="filterStatus" class="filter-pill"><option value="all">Situação: Todas</option><option value="pending">Pendentes</option><option value="completed">Concluídas</option></select>
            <select id="filterCategory" class="filter-pill"><option value="all">Categoria: Todas</option><option value="Trabalho">Trabalho</option><option value="Projeto">Projeto</option><option value="Pessoal">Pessoal</option></select>
            <select id="filterPriority" class="filter-pill"><option value="all">Prioridade: Todas</option><option value="high">Alta</option><option value="medium">Média</option><option value="low">Baixa</option></select>
            <select id="sortSelect" class="filter-pill"><option value="manual">Ord: Manual</option><option value="date">Ord: Prazo</option><option value="priority">Ord: Prioridade</option></select>
        </div>
    </div>
    <div class="global-progress"><div class="global-progress-fill" id="globalProgressFill"></div></div>
    <div class="pomodoro-bar" id="pomodoroBar"></div>
</header>
<main class="main-content" id="taskList"></main>
<div class="chart-container" id="chartContainer"><canvas id="productivityChart"></canvas></div>
<button class="fab" id="openModalBtn"><i class="ph ph-plus"></i></button>
<dialog id="taskModal"><div class="modal-content"><div class="modal-header"><span id="modalTitle">Nova Tarefa</span><button class="icon-btn cancel-modal"><i class="ph ph-x"></i></button></div><form id="taskForm"><div class="form-group"><label>Título</label><input type="text" id="taskTitle" class="form-control" required></div><div class="form-group"><label>Descrição</label><textarea id="taskDesc" class="form-control"></textarea></div><div class="grid-2"><div class="form-group"><label>Prioridade</label><select id="taskPriority" class="form-control"><option value="low">Baixa</option><option value="medium" selected>Média</option><option value="high">Alta</option></select></div><div class="form-group"><label>Data Limite</label><input type="date" id="taskDate" class="form-control"></div></div><div class="form-group"><label>Categoria</label><select id="taskCategory" class="form-control"><option value="Trabalho">Trabalho</option><option value="Projeto">Projeto</option><option value="Pessoal">Pessoal</option></select></div><div class="form-group"><label>Checklist</label><button type="button" id="addSubtaskBtn" style="background:var(--bg-base); border:1px solid var(--border-color); padding:0.3rem 0.6rem; border-radius:6px;">+ Item</button><div id="subtaskList"></div></div><button type="submit" class="btn-primary">Guardar</button></form></div></dialog>
<dialog id="confirmDialog"><div class="modal-content"><div class="modal-header"><span id="confirmTitle">Confirmação</span><button class="icon-btn" id="closeConfirm"><i class="ph ph-x"></i></button></div><p id="confirmMessage"></p><div class="btn-group"><button id="confirmCancel">Cancelar</button><button id="confirmOk" class="btn-primary-confirm">Confirmar</button></div></div></dialog>
<dialog id="modelDialog"><div class="modal-content"><div class="modal-header"><span>Modelos de Importação</span><button class="icon-btn" id="closeModelDialog"><i class="ph ph-x"></i></button></div><textarea readonly class="form-control" rows="5" id="modelText"></textarea><button id="downloadCsvModel" class="btn-primary" style="margin-top:0.5rem;">Baixar CSV Exemplo</button><button id="downloadJsonModel" class="btn-primary">Baixar JSON Exemplo</button></div></dialog>
<div id="toast"><span id="toastMsg"></span><button id="toastAction" class="toast-action" style="display:none;">Desfazer</button></div>

<script>
// --------------------------------------------------------------
// IMPLEMENTAÇÃO COMPLETA (TUDO FUNCIONAL) - CORREÇÃO TEMA ESCURO
// --------------------------------------------------------------
class TaskApp {
    constructor() {
        this.storageKey = 'taskflow_unified';
        this.tasks = [];
        this.lastDeleted = null;
        this.sortable = null;
        this.gridView = false;
        this.chartVisible = false;
        this.pomodoroInterval = null;
        this.pomodoroRunning = false;
        this.pomodoroTime = 25 * 60;
        this.pomodoroRemaining = 25 * 60;
        this.init();
    }

    init() {
        this.loadData();
        this.bindEvents();
        // Garantir tema escuro como padrão, sem classe light-theme inicialmente
        const savedTheme = localStorage.getItem('theme');
        const isLight = savedTheme === 'light';
        this.applyTheme(isLight);
        this.render();
        setInterval(() => this.checkDueDates(), 60000);
        if (localStorage.getItem('chartVisible') === 'true') this.toggleChart(true);
        this.initSortable();
        document.getElementById('taskDate').value = new Date().toISOString().slice(0,10);
    }

    loadData() {
        const stored = localStorage.getItem(this.storageKey);
        if(stored) this.tasks = JSON.parse(stored);
        else this.tasks = [
            { id: Date.now()+1, title: "Revisar proposta", description: "Alinhar com equipe", priority: "high", category: "Trabalho", date: new Date().toISOString().slice(0,10), completed: false, subtasks: [] },
            { id: Date.now()+2, title: "Estudar React", description: "Hooks avançados", priority: "medium", category: "Estudo", date: new Date().toISOString().slice(0,10), completed: false, subtasks: [] },
            { id: Date.now()+3, title: "Academia", description: "Treino A", priority: "low", category: "Pessoal", date: new Date().toISOString().slice(0,10), completed: true, subtasks: [] }
        ];
    }

    save() { localStorage.setItem(this.storageKey, JSON.stringify(this.tasks)); this.updateStats(); }

    updateStats() {
        const total = this.tasks.length;
        const completed = this.tasks.filter(t=>t.completed).length;
        const rate = total ? Math.round(completed/total*100) : 0;
        const pending = total - completed;
        const high = this.tasks.filter(t=>!t.completed && t.priority==='high').length;
        document.getElementById('kpi-rate').innerHTML = `<i class="ph-fill ph-check-circle"></i> ${rate}%`;
        document.getElementById('kpi-pending').innerHTML = `<i class="ph-fill ph-hourglass-high"></i> ${pending} pendentes`;
        document.getElementById('kpi-high').innerHTML = `<i class="ph-fill ph-fire"></i> ${high} críticas`;
        document.getElementById('globalProgressFill').style.width = `${rate}%`;
        if(this.chartVisible) this.drawChart();
    }

    getFiltered() {
        let filtered = [...this.tasks];
        const status = document.getElementById('filterStatus').value;
        const cat = document.getElementById('filterCategory').value;
        const prio = document.getElementById('filterPriority').value;
        const search = document.getElementById('searchInput').value.trim().toLowerCase();
        const sort = document.getElementById('sortSelect').value;
        if(status === 'pending') filtered = filtered.filter(t=>!t.completed);
        if(status === 'completed') filtered = filtered.filter(t=>t.completed);
        if(cat !== 'all') filtered = filtered.filter(t=>t.category === cat);
        if(prio !== 'all') filtered = filtered.filter(t=>t.priority === prio);
        if(search) {
            const fuse = new Fuse(filtered, { keys: ['title','description','category'], threshold: 0.4 });
            filtered = fuse.search(search).map(r=>r.item);
        }
        if(sort === 'date') filtered.sort((a,b)=>a.date.localeCompare(b.date));
        if(sort === 'priority') { const w={high:1,medium:2,low:3}; filtered.sort((a,b)=>w[a.priority]-w[b.priority]); }
        const canDrag = (sort === 'manual' && status === 'all' && cat === 'all' && prio === 'all' && !search);
        if(this.sortable) this.sortable.option('disabled', !canDrag);
        document.getElementById('clearFiltersBtn').style.display = (status!=='all'||cat!=='all'||prio!=='all'||search) ? 'flex' : 'none';
        return filtered;
    }

    render() {
        const tasks = this.getFiltered();
        const container = document.getElementById('taskList');
        container.innerHTML = '';
        if(tasks.length === 0) { container.innerHTML = '<div style="text-align:center; padding:3rem; color:var(--text-support);">Nenhuma tarefa encontrada</div>'; return; }
        const today = new Date().toISOString().slice(0,10);
        tasks.forEach(task => {
            const card = document.createElement('div');
            card.className = `task-card ${task.completed ? 'completed' : ''} ${task.date === today && !task.completed ? 'today' : ''}`;
            card.dataset.id = task.id;
            const isOverdue = !task.completed && task.date < today;
            const subtasksHtml = task.subtasks?.length ? `<div class="task-checklist">${task.subtasks.map(sub => `<label class="checklist-item ${sub.done ? 'done' : ''}" data-task="${task.id}" data-sub="${sub.id}"><input type="checkbox" ${sub.done ? 'checked' : ''}> <span>${this.escape(sub.text)}</span></label>`).join('')}</div>` : '';
            const progressHtml = task.subtasks?.length ? `<div class="subtask-container"><span style="color:var(--text-support);">${task.subtasks.filter(s=>s.done).length}/${task.subtasks.length}</span><div class="progress-track"><div class="progress-fill" style="width:${task.subtasks.filter(s=>s.done).length/task.subtasks.length*100}%"></div></div></div>` : '';
            card.innerHTML = `
                <div class="task-header">
                    <input type="checkbox" class="custom-cb toggle-complete" data-id="${task.id}" ${task.completed ? 'checked' : ''}>
                    <div class="task-content">
                        <div class="task-title-row" data-id="${task.id}">
                            <div class="priority-dot ${task.priority}"></div>
                            <div class="task-title">${this.escape(task.title)}</div>
                        </div>
                        ${task.description ? `<div class="task-desc" data-id="${task.id}">${this.escape(task.description)}</div>` : ''}
                        ${subtasksHtml}
                    </div>
                    <div class="task-actions-row">
                        <button class="action-icon options-btn" data-id="${task.id}"><i class="ph-bold ph-dots-three"></i></button>
                        <div class="drag-handle"><i class="ph ph-list"></i></div>
                    </div>
                </div>
                <div class="task-footer">
                    ${progressHtml || '<div></div>'}
                    <div class="task-meta">
                        <span class="badge"><i class="ph ph-tag"></i> ${task.category}</span>
                        <span class="badge ${isOverdue ? 'overdue' : ''} ${task.date === today ? 'today' : ''}"><i class="ph ph-calendar-blank"></i> ${task.date.split('-').reverse().join('/')}</span>
                    </div>
                </div>`;
            container.appendChild(card);
        });
        this.attachCardEvents();
        this.updateStats();
    }

    attachCardEvents() {
        document.querySelectorAll('.toggle-complete').forEach(cb => cb.onchange = e => this.toggleComplete(parseInt(cb.dataset.id)));
        document.querySelectorAll('.task-title-row, .task-desc').forEach(el => el.onclick = e => this.openEditModal(parseInt(el.dataset.id)));
        document.querySelectorAll('.options-btn').forEach(btn => btn.onclick = e => { e.stopPropagation(); this.showOptions(parseInt(btn.dataset.id)); });
        document.querySelectorAll('.checklist-item input').forEach(ch => ch.onchange = e => { const parent = ch.closest('.checklist-item'); if(parent) this.toggleSubtask(parseInt(parent.dataset.task), parent.dataset.sub, ch.checked); });
    }

    toggleComplete(id) { const t = this.tasks.find(t=>t.id===id); if(t){ t.completed = !t.completed; if(t.completed && t.subtasks) t.subtasks.forEach(s=>s.done=true); this.save(); this.render(); } }
    toggleSubtask(taskId, subId, checked) { const t = this.tasks.find(t=>t.id===taskId); if(t && t.subtasks){ const sub = t.subtasks.find(s=>String(s.id)===String(subId)); if(sub){ sub.done = checked; const allDone = t.subtasks.every(s=>s.done); t.completed = allDone; this.save(); this.render(); } } }

    openEditModal(id) { this.editingId = id; const t = this.tasks.find(t=>t.id===id); if(!t) return; document.getElementById('modalTitle').innerText = 'Editar Tarefa'; document.getElementById('taskTitle').value = t.title; document.getElementById('taskDesc').value = t.description || ''; document.getElementById('taskPriority').value = t.priority; document.getElementById('taskCategory').value = t.category; document.getElementById('taskDate').value = t.date; this.renderSubtasks(t.subtasks || []); document.getElementById('taskModal').showModal(); }

    renderSubtasks(subtasks) { const container = document.getElementById('subtaskList'); container.innerHTML = ''; subtasks.forEach(sub => { const div = document.createElement('div'); div.className = 'subtask-item'; div.innerHTML = `<input type="text" class="form-control sub-input" data-id="${sub.id}" value="${this.escape(sub.text)}" placeholder="Item"> <button type="button" class="action-icon del-sub"><i class="ph ph-trash"></i></button>`; container.appendChild(div); }); }

    addSubtaskRow() { const container = document.getElementById('subtaskList'); const div = document.createElement('div'); div.className = 'subtask-item'; div.innerHTML = `<input type="text" class="form-control sub-input" data-id="sub_${Date.now()}" placeholder="Novo item"> <button type="button" class="action-icon del-sub"><i class="ph ph-trash"></i></button>`; container.appendChild(div); }

    saveTaskFromModal() { const title = document.getElementById('taskTitle').value.trim(); if(!title) return this.showToast('Título obrigatório'); const subs = Array.from(document.querySelectorAll('.sub-input')).map(inp => ({ id: inp.dataset.id, text: inp.value.trim(), done: false })); const data = { title, description: document.getElementById('taskDesc').value, priority: document.getElementById('taskPriority').value, category: document.getElementById('taskCategory').value, date: document.getElementById('taskDate').value, subtasks: subs }; if(this.editingId){ const idx = this.tasks.findIndex(t=>t.id===this.editingId); if(idx>-1) this.tasks[idx] = { ...this.tasks[idx], ...data }; } else { this.tasks.unshift({ id: Date.now(), completed: false, ...data }); } this.save(); this.render(); this.closeModal(); }

    closeModal() { document.getElementById('taskModal').close(); this.editingId = null; document.getElementById('taskForm').reset(); document.getElementById('subtaskList').innerHTML = ''; }

    showOptions(id) { this.activeId = id; const sheet = document.createElement('dialog'); sheet.className = 'bottom-sheet'; sheet.innerHTML = `<div class="modal-content"><div class="sheet-grip"></div><div class="modal-header">Opções</div><button id="optEdit">Editar</button><button id="optDup">Duplicar</button><button id="optDel" class="danger">Excluir</button><button class="cancel-modal">Fechar</button></div>`; document.body.appendChild(sheet); sheet.showModal(); sheet.querySelector('#optEdit').onclick = () => { this.openEditModal(id); sheet.close(); }; sheet.querySelector('#optDup').onclick = () => { const t = this.tasks.find(t=>t.id===id); if(t) this.tasks.unshift({ ...t, id: Date.now(), title: t.title + ' (cópia)', completed: false }); this.save(); this.render(); sheet.close(); }; sheet.querySelector('#optDel').onclick = async () => { if(await this.confirm('Excluir tarefa?')){ this.lastDeleted = this.tasks.find(t=>t.id===id); this.tasks = this.tasks.filter(t=>t.id!==id); this.save(); this.render(); this.showToast('Tarefa removida', true); } sheet.close(); }; sheet.querySelector('.cancel-modal').onclick = () => sheet.close(); }

    confirm(msg) { return new Promise(resolve => { const dlg = document.getElementById('confirmDialog'); document.getElementById('confirmMessage').innerText = msg; dlg.showModal(); const ok = () => { resolve(true); dlg.close(); cleanup(); }; const cancel = () => { resolve(false); dlg.close(); cleanup(); }; const cleanup = () => { document.getElementById('confirmOk').removeEventListener('click', ok); document.getElementById('confirmCancel').removeEventListener('click', cancel); document.getElementById('closeConfirm').removeEventListener('click', cancel); }; document.getElementById('confirmOk').addEventListener('click', ok); document.getElementById('confirmCancel').addEventListener('click', cancel); document.getElementById('closeConfirm').addEventListener('click', cancel); }); }

    undoDelete() { if(this.lastDeleted){ this.tasks.unshift(this.lastDeleted); this.lastDeleted = null; this.save(); this.render(); this.showToast('Restaurado'); } }

    deleteCompleted() { const hasCompleted = this.tasks.some(t=>t.completed); if(!hasCompleted) return; this.tasks = this.tasks.filter(t=>!t.completed); this.save(); this.render(); this.showToast('Concluídas removidas'); }

    exportData() { const dataStr = JSON.stringify(this.tasks, null, 2); const blob = new Blob([dataStr], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `taskflow_backup_${new Date().toISOString().slice(0,19)}.json`; a.click(); URL.revokeObjectURL(a.href); this.showToast('Backup exportado'); }

    importData(file) { const reader = new FileReader(); reader.onload = e => { try{ const imported = JSON.parse(e.target.result); if(Array.isArray(imported)){ this.tasks = imported; this.save(); this.render(); this.showToast('Importado com sucesso'); } else throw new Error(); } catch(err){ this.showToast('Arquivo inválido', false, true); } }; reader.readAsText(file); }

    parseCSV(csv) { const lines = csv.split('\n').slice(1); return lines.filter(l=>l.trim()).map(l => { const [title, desc, priority, category, date, subtasks] = l.split(',').map(s=>s.replace(/^"|"$/g, '')); return { title, description: desc || '', priority: priority || 'medium', category: category || 'Pessoal', date: date || new Date().toISOString().slice(0,10), subtasks: subtasks ? subtasks.split(';').map(t=>({ id:'sub_'+Date.now()+Math.random(), text:t, done:false })) : [] }; }); }

    importList(file) { const reader = new FileReader(); reader.onload = e => { const content = e.target.result; if(file.name.endsWith('.json')){ const imported = JSON.parse(content); if(Array.isArray(imported)) this.tasks.unshift(...imported.map(t=>({ ...t, id: Date.now()+Math.random(), completed: false }))); } else if(file.name.endsWith('.csv')){ const imported = this.parseCSV(content); this.tasks.unshift(...imported.map(t=>({ ...t, id: Date.now()+Math.random(), completed: false }))); } this.save(); this.render(); this.showToast('Lista importada'); }; reader.readAsText(file); }

    downloadModel(type) { let content = ''; if(type==='csv') content = 'title,description,priority,category,date,subtasks\n"Exemplo","Descrição","high","Trabalho","2026-06-01","Subtarefa1;Subtarefa2"'; else content = JSON.stringify([{title:"Exemplo",description:"Desc",priority:"high",category:"Trabalho",date:"2026-06-01",subtasks:["Subtarefa1"]}],null,2); const blob = new Blob([content], {type: type==='csv'?'text/csv':'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `modelo.${type}`; a.click(); }

    toggleChart(force) { this.chartVisible = force !== undefined ? force : !this.chartVisible; document.getElementById('chartContainer').classList.toggle('visible', this.chartVisible); localStorage.setItem('chartVisible', this.chartVisible); if(this.chartVisible) this.drawChart(); }

    drawChart() { const canvas = document.getElementById('productivityChart'); const ctx = canvas.getContext('2d'); const days = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb']; const weekCounts = new Array(7).fill(0); const today = new Date(); this.tasks.filter(t=>t.completed && t.completedDate).forEach(t=>{ const d = new Date(t.completedDate); if((today-d)/(1000*3600*24)<=7) weekCounts[d.getDay()]++; }); const max = Math.max(...weekCounts,1); canvas.width = canvas.offsetWidth*2; canvas.height = canvas.offsetHeight*2; ctx.clearRect(0,0,canvas.width,canvas.height); const barW = canvas.width/14; days.forEach((d,i)=>{ const h = (weekCounts[i]/max)*(canvas.height-20); ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--brand-primary'); ctx.fillRect(i*(barW+5), canvas.height-h-10, barW, h); ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--text-support'); ctx.fillText(d, i*(barW+5), canvas.height-5); }); }

    toggleTheme() { const isLight = document.body.classList.toggle('light-theme'); localStorage.setItem('theme', isLight ? 'light' : 'dark'); this.applyTheme(isLight); }

    applyTheme(isLight) { 
        if(isLight) document.body.classList.add('light-theme');
        else document.body.classList.remove('light-theme');
        document.getElementById('themeToggleQuick').innerHTML = `<i class="ph ph-${isLight ? 'sun' : 'moon'}"></i>`;
    }

    initSortable() { this.sortable = new Sortable(document.getElementById('taskList'), { animation: 250, handle: '.drag-handle', ghostClass: 'sortable-ghost', onEnd: (evt) => { const moved = this.tasks.splice(evt.oldIndex, 1)[0]; this.tasks.splice(evt.newIndex, 0, moved); this.save(); this.render(); } }); }

    startPomodoro() { if(this.pomodoroRunning){ clearInterval(this.pomodoroInterval); this.pomodoroRunning=false; document.getElementById('pomodoroBtn').classList.remove('pomodoro-active'); document.getElementById('pomodoroBar').style.width='0%'; return; } this.pomodoroRemaining = 25*60; this.pomodoroRunning=true; document.getElementById('pomodoroBtn').classList.add('pomodoro-active'); this.pomodoroInterval = setInterval(()=>{ if(this.pomodoroRemaining<=0){ clearInterval(this.pomodoroInterval); this.pomodoroRunning=false; this.showToast('Pomodoro concluído!'); document.getElementById('pomodoroBtn').classList.remove('pomodoro-active'); } else { this.pomodoroRemaining--; const pct = ((25*60 - this.pomodoroRemaining)/(25*60))*100; document.getElementById('pomodoroBar').style.width = `${pct}%`; } },1000); }

    checkDueDates() { const today = new Date().toISOString().slice(0,10); const overdue = this.tasks.filter(t=>!t.completed && t.date < today).length; if(overdue) this.showToast(`${overdue} tarefa(s) atrasada(s)`); }

    showToast(msg, undo=false, isError=false) { const toast = document.getElementById('toast'); document.getElementById('toastMsg').innerHTML = msg; const btn = document.getElementById('toastAction'); btn.style.display = undo ? 'block' : 'none'; btn.onclick = () => { this.undoDelete(); toast.classList.remove('show'); }; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'), 3000); }

    escape(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

    bindEvents() {
        document.getElementById('taskForm').onsubmit = e => { e.preventDefault(); this.saveTaskFromModal(); };
        document.getElementById('addSubtaskBtn').onclick = () => this.addSubtaskRow();
        document.querySelectorAll('.cancel-modal').forEach(btn => btn.onclick = () => this.closeModal());
        document.getElementById('openModalBtn').onclick = () => { this.editingId = null; document.getElementById('modalTitle').innerText = 'Nova Tarefa'; document.getElementById('taskForm').reset(); document.getElementById('taskDate').value = new Date().toISOString().slice(0,10); document.getElementById('subtaskList').innerHTML = ''; document.getElementById('taskModal').showModal(); };
        document.getElementById('exportBtn').onclick = () => this.exportData();
        document.getElementById('restoreFileInput').onchange = e => { if(e.target.files[0]) this.importData(e.target.files[0]); e.target.value=''; };
        document.getElementById('importListBtn').onclick = () => document.getElementById('importListFileInput').click();
        document.getElementById('importListFileInput').onchange = e => { if(e.target.files[0]) this.importList(e.target.files[0]); e.target.value=''; };
        document.getElementById('clearCompletedBtn').onclick = () => this.deleteCompleted();
        document.getElementById('downloadModelBtn').onclick = () => document.getElementById('modelDialog').showModal();
        document.getElementById('closeModelDialog').onclick = () => document.getElementById('modelDialog').close();
        document.getElementById('downloadCsvModel').onclick = () => this.downloadModel('csv');
        document.getElementById('downloadJsonModel').onclick = () => this.downloadModel('json');
        document.getElementById('toggleChartBtn').onclick = () => this.toggleChart();
        document.getElementById('viewToggle').onclick = () => { this.gridView = !this.gridView; document.getElementById('taskList').classList.toggle('grid-view', this.gridView); };
        document.getElementById('themeToggleQuick').onclick = () => this.toggleTheme();
        document.getElementById('pomodoroBtn').onclick = () => this.startPomodoro();
        document.getElementById('menuToggle').onclick = e => { e.stopPropagation(); document.getElementById('mainMenu').classList.toggle('active'); };
        document.addEventListener('click', (e) => { if(!e.target.closest('#mainMenu') && !e.target.closest('#menuToggle')) document.getElementById('mainMenu').classList.remove('active'); });
        document.getElementById('filterStatus').onchange = () => this.render();
        document.getElementById('filterCategory').onchange = () => this.render();
        document.getElementById('filterPriority').onchange = () => this.render();
        document.getElementById('sortSelect').onchange = () => this.render();
        document.getElementById('searchInput').oninput = () => this.render();
        document.getElementById('clearFiltersBtn').onclick = () => { document.getElementById('filterStatus').value='all'; document.getElementById('filterCategory').value='all'; document.getElementById('filterPriority').value='all'; document.getElementById('searchInput').value=''; document.getElementById('sortSelect').value='manual'; this.render(); };
        document.addEventListener('keydown', e => { if((e.ctrlKey||e.metaKey) && e.key==='k'){ e.preventDefault(); document.getElementById('searchInput').focus(); } if(e.key==='n' && document.activeElement.tagName!=='INPUT' && document.activeElement.tagName!=='TEXTAREA') document.getElementById('openModalBtn').click(); });
    }
}
new TaskApp();
</script>
</body>
</html>
